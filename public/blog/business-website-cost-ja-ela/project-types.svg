</defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#FFFFFF"/><text x="60" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#12100E" text-anchor="start">Five types of business website, and what drives their cost</text><text x="60" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C554D" text-anchor="start">Typical 2026 Sri Lankan market ranges (LKR). Cost rises with custom logic and data, not page count.</text><line x1="60" y1="560" x2="1140" y2="560" stroke="#E3E0DA" stroke-width="2" stroke-linecap="round"/><rect x="80" y="470" width="170" height="90" rx="12" fill="#FFF6EB" stroke="#E3E0DA" stroke-width="1.5"/><text x="94" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#BF4508" text-anchor="start">80k–200k</text><text x="80" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="start">Basic business</text><text x="80" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Design adaptation</text><text x="80" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Contact + WhatsApp</text><text x="80" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Basic SEO</text><rect x="292" y="400" width="170" height="160" rx="12" fill="#FFF6EB" stroke="#E3E0DA" stroke-width="1.5"/><text x="306" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#BF4508" text-anchor="start">200k–500k</text><text x="292" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="start">Corporate</text><text x="292" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Custom UI + IA</text><text x="292" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Content &amp; proof</text><text x="292" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· CMS</text><rect x="504" y="310" width="170" height="250" rx="12" fill="url(#g)"/><text x="518" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">350k–1.2M</text><text x="504" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="start">Catalogue</text><text x="504" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Product data model</text><text x="504" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Filters + spec PDFs</text><text x="504" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Quote requests</text><rect x="716" y="240" width="170" height="320" rx="12" fill="#FFF6EB" stroke="#E3E0DA" stroke-width="1.5"/><text x="730" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#BF4508" text-anchor="start">700k–2.5M+</text><text x="716" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="start">E-commerce</text><text x="716" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Cart + gateway</text><text x="716" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Delivery + stock</text><text x="716" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Order management</text><rect x="928" y="170" width="170" height="390" rx="12" fill="#FFF6EB" stroke="#E3E0DA" stroke-width="1.5"/><text x="942" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#BF4508" text-anchor="start">1.5M+</text><text x="928" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="start">Custom web app</text><text x="928" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· Business logic</text><text x="928" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· ERP / CRM links</text><text x="928" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C554D" text-anchor="start">· User accounts</text></svg>