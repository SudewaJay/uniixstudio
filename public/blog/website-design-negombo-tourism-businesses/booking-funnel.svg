</defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#FFFFFF"/><text x="60" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#12100E" text-anchor="start">Traffic → enquiry → booking</text><text x="60" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C554D" text-anchor="start">Each stage leaks for a different reason. Fix the stage that's failing.</text><rect x="60" y="140" width="1080" height="120" rx="16" fill="#FBFAF6" stroke="#E3E0DA" stroke-width="1.5"/><text x="600" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#BF4508" text-anchor="middle" letter-spacing="3">TRAFFIC</text><text x="600" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="middle">Search · Google Maps · OTA listings · social · referrals</text><text x="600" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C554D" text-anchor="middle">Leaks when: not visible, weak profile, no local pages</text><rect x="190" y="300" width="820" height="120" rx="16" fill="#FFF6EB"/><text x="600" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#BF4508" text-anchor="middle" letter-spacing="3">ENQUIRY</text><text x="600" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#12100E" text-anchor="middle">WhatsApp · availability check · form · call</text><text x="600" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C554D" text-anchor="middle">Leaks when: slow, no prices, hidden CTA, weak trust</text><rect x="320" y="460" width="560" height="120" rx="16" fill="url(#g)"/><text x="600" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="3">BOOKING</text><text x="600" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Confirmed reservation, deposit or payment</text><text x="600" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#fff" text-anchor="middle">Leaks when: slow replies, no follow-up, no payment path</text></svg>