ect x="60" y="544" width="1080" height="44" rx="8" fill="#FBFAF6"/><rect x="76" y="556" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#E3E0DA" stroke-width="1.5"/><text x="112" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5C554D" text-anchor="start">09</text><text x="150" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12100E" text-anchor="start">No conversion tracking</text><text x="420" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A342D" text-anchor="start">Can you count last month's enquiries?</text><rect x="1010" y="553" width="110" height="26" rx="13" fill="#FFF6EB"/><text x="1065" y="570.55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BF4508" text-anchor="middle">Refresh</text><rect x="60" y="596" width="1080" height="44" rx="8" fill="#FFFFFF"/><rect x="76" y="608" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#E3E0DA" stroke-width="1.5"/><text x="112" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5C554D" text-anchor="start">10</text><text x="150" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12100E" text-anchor="start">No enquiries</text><text x="420" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A342D" text-anchor="start">Does the site produce conversations at all?</text><rect x="1010" y="605" width="110" height="26" rx="13" fill="#BF4508"/><text x="1065" y="622.55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Rebuild</text></svg>