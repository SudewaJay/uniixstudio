xt><rect x="1010" y="293" width="110" height="26" rx="13" fill="#FFF6EB"/><text x="1065" y="310.55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#BF4508" text-anchor="middle">Refresh</text><rect x="60" y="336" width="1080" height="44" rx="8" fill="#FBFAF6"/><rect x="76" y="348" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#E3E0DA" stroke-width="1.5"/><text x="112" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5C554D" text-anchor="start">05</text><text x="150" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12100E" text-anchor="start">Difficult navigation</text><text x="420" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A342D" text-anchor="start">Do customers call to ask what the site says?</text><rect x="1010" y="345" width="110" height="26" rx="13" fill="#BF4508"/><text x="1065" y="362.55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Rebuild</text><rect x="60" y="388" width="1080" height="44" rx="8" fill="#FFFFFF"/><rect x="76" y="400" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#E3E0DA" stroke-width="1.5"/><text x="112" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5C554D" text-anchor="start">06</text><text x="150" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12100E" text-anchor="start">Weak trust signals</text><text x="420" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A342D" text-anchor="start">Is there proof, not just adjectives?</text><rect x="1010" y="397" width="110" height="26" rx="13" fill="#FFF6EB"/><text x="1065" y="414.55" font-family="Helvetica 